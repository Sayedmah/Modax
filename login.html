<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Modax AI — تسجيل الدخول</title><style>
:root{--bg:#080a11;--panel:#121725;--line:#292f43;--text:#f7f5ff;--muted:#949bb0;--purple:#8b5cf6;--cyan:#22d3ee;--danger:#f87171}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#24164a 0,#0b0e17 36%,#080a11 70%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#101521eF;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 35px 90px #0009}.brand{text-align:center;margin-bottom:22px}.mascot{width:86px;height:86px;margin:0 auto 14px;border-radius:28px;display:grid;place-items:center;font-size:36px;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 14px 45px #7c3aed55}.brand h1{margin:0;font-size:28px}.tag{margin-top:5px;color:#d7d4e8}.tagAr{margin-top:4px;color:var(--muted);font-size:14px}.social{display:grid;gap:10px;margin:20px 0}.btn{height:48px;border-radius:14px;border:1px solid var(--line);background:#171c2b;color:white;font-weight:700;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--purple),#2563eb)}.btn:disabled{opacity:.45;cursor:not-allowed}.divider{display:flex;align-items:center;gap:10px;color:#697188;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;color:#c9cede}.field input{height:46px;border-radius:13px;border:1px solid var(--line);background:#0c101a;color:white;padding:0 13px;outline:none}.field input:focus{border-color:#7656c9}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.link{border:0;background:transparent;color:#b9a7ff;cursor:pointer;padding:10px}.msg{min-height:22px;margin-top:12px;font-size:13px;text-align:center;color:var(--muted)}.msg.err{color:var(--danger)}.small{text-align:center;color:#6f768a;font-size:11px;margin-top:14px}@media(max-width:520px){.card{padding:22px;border-radius:22px}.actions{grid-template-columns:1fr}}
</style></head><body><main class="card"><section class="brand"><div class="mascot">M</div><h1>Modax AI</h1><div class="tag">All AI. One Place.</div><div class="tagAr">كل الذكاء الاصطناعي في مكان واحد</div></section><div class="social"><button class="btn" id="google">متابعة باستخدام Google</button><button class="btn" id="apple" disabled>Apple — قريبًا</button></div><div class="divider">أو باستخدام البريد الإلكتروني</div><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="••••••••"></div><div class="actions"><button class="btn primary" id="signin">تسجيل الدخول</button><button class="btn" id="signup">إنشاء حساب</button></div><button class="link" id="forgot">نسيت كلمة المرور؟</button><div class="msg" id="msg"></div><div class="small">بتسجيل الدخول أنت تستخدم حساب Modax AI الخاص بك.</div></main><script src="auth.js"></script><script>
const $=s=>document.querySelector(s),msg=(text,error=false)=>{$('#msg').textContent=text;$('#msg').className='msg'+(error?' err':'')};
(async()=>{try{if(await window.modaxAuth.getSession())location.replace('./index.html')}catch{}})();
$('#google').onclick=async()=>{try{msg('جاري فتح Google…');await window.modaxAuth.signInWithOAuth('google')}catch(e){msg(e.message||'تعذر تسجيل الدخول',true)}};
$('#signin').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return msg('أدخل البريد الإلكتروني وكلمة المرور',true);try{msg('جاري تسجيل الدخول…');await window.modaxAuth.signInWithEmail(email,password);location.replace('./index.html')}catch(e){msg(e.message||'تعذر تسجيل الدخول',true)}};
$('#signup').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<8)return msg('استخدم بريدًا صحيحًا وكلمة مرور 8 أحرف على الأقل',true);try{msg('جاري إنشاء الحساب…');const data=await window.modaxAuth.signUpWithEmail(email,password);if(data.session)location.replace('./index.html');else msg('تم إنشاء الحساب. راجع بريدك لتأكيد الحساب.')}catch(e){msg(e.message||'تعذر إنشاء الحساب',true)}};
$('#forgot').onclick=async()=>{const email=$('#email').value.trim();if(!email)return msg('اكتب البريد الإلكتروني أولًا',true);try{await window.modaxAuth.resetPassword(email);msg('تم إرسال رابط استعادة كلمة المرور إلى بريدك.')}catch(e){msg(e.message||'تعذر إرسال رابط الاستعادة',true)}};
</script></body></html>
