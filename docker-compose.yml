services:
  modax:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODAX_DATA_DIR: /data
      MODAX_DEMO: "true"
      MODAX_ALLOW_SIGNUP: "false"
    volumes:
      - modax-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  modax-data:
