<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MODY AI</title><style>body{font-family:system-ui;background:#080b12;color:#eef4ff;margin:0;padding:24px}main{max-width:900px;margin:auto}.card{background:#101624;border:1px solid #26324a;border-radius:18px;padding:18px;margin:14px 0}textarea,select,button{font:inherit}textarea,select{width:100%;box-sizing:border-box;background:#151d2f;color:#eef4ff;border:1px solid #26324a;border-radius:12px;padding:12px}button{background:#6d28d9;color:white;border:0;border-radius:12px;padding:11px 18px;cursor:pointer}.row{display:flex;gap:10px;align-items:center}.status,.muted{font-size:14px;color:#92a0ba}.msg{white-space:pre-wrap;padding:12px;margin:8px 0;border-radius:12px;background:#151d2f}.user{background:#243b72}.meta{font-size:12px;color:#92a0ba;margin-bottom:5px}</style></head><body><main><h1>MODY AI</h1><div class="status" id="status">جاري الاتصال تلقائيًا…</div><div class="card"><label>النموذج</label><select id="model"><option value="auto">AUTO — أفضل نموذج متاح</option></select><div class="muted" id="priority" style="margin-top:8px">يتم تحميل ترتيب النماذج المتاحة…</div></div><div class="card" id="messages"><div class="msg">مرحبًا بك في MODY AI. وضع AUTO يختار أقوى نموذج متاح وينتقل تلقائيًا لبديل عند الازدحام أو عدم الإتاحة.</div></div><div class="card"><textarea id="prompt" rows="4" placeholder="اكتب رسالتك…"></textarea><div class="row" style="margin-top:10px"><button id="send">إرسال</button></div></div><div class="card"><strong>الاتصال الآمن</strong><div class="muted">MODY Backend متصل تلقائيًا. مفتاح Gemini محفوظ على الخادم ولا يُخزن في GitHub Pages أو المتصفح.</div></div></main><script>const BACKEND='https://modaxai.onrender.com';const $=s=>document.querySelector(s);async function request(path,opts={}){const r=await fetch(BACKEND+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}async function boot(){try{const h=await request('/health');$('#status').textContent=`متصل بـ MODY Backend — ${h.version||'online'}${h.autoRouting?' — AUTO Routing':''}`;const d=await request('/v1/models?provider=google');const priority=d.auto_priority||[];$('#priority').textContent=priority.length?'ترتيب AUTO الحالي: '+priority.join(' ← '):'سيحدد الخادم أفضل نموذج متاح تلقائيًا.';$('#model').innerHTML='<option value="auto">AUTO — أفضل نموذج متاح</option>';priority.forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=id;$('#model').appendChild(o)})}catch(e){$('#status').textContent='تعذر الاتصال: '+e.message}}function add(cls,text,meta=''){const d=document.createElement('div');d.className='msg '+cls;if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;d.appendChild(m)}d.append(document.createTextNode(text));$('#messages').appendChild(d)}async function send(){const text=$('#prompt').value.trim();if(!text)return;$('#prompt').value='';add('user',text);$('#send').disabled=true;try{const d=await request('/v1/chat',{method:'POST',body:JSON.stringify({provider:'google',model:$('#model').value||'auto',prompt:text})});const fallbacks=(d.attempts||[]).length;add('',d.response||d.text||'لم يصل رد نصي.',`MODY · ${d.model||'AUTO'}${fallbacks?' · تم تجاوز '+fallbacks+' نموذج غير متاح':''}`)}catch(e){add('','خطأ: '+e.message)}finally{$('#send').disabled=false}}$('#send').onclick=send;$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});boot();</script></body></html>
