<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="mody-icon.svg"><title>MODY AI</title><style>
:root{--bg:#090b12;--side:#0d1019;--panel:#121624;--panel2:#171c2c;--text:#f4f3ff;--muted:#9ca3b8;--line:#252b3c;--purple:#8b5cf6;--purple2:#6d28d9;--cyan:#22d3ee;--good:#34d399;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;height:100vh;overflow:hidden}button,textarea,select{font:inherit}.shell{display:grid;grid-template-columns:280px 1fr;height:100vh}.sidebar{background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{height:68px;display:flex;align-items:center;gap:11px;padding:0 16px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 8px 28px #7c3aed55}.brand strong{font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.newchat{margin:4px 12px 12px;border:1px solid #6946aa;background:#1a1530;color:white;padding:11px 13px;border-radius:12px;cursor:pointer;text-align:right}.newchat:hover{background:#251a45}.sideLabel{padding:8px 16px;color:#7f879d;font-size:12px}.chatlist{overflow:auto;padding:0 8px;flex:1}.chatrow{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;padding:5px;border-radius:10px;margin:2px 0}.chatrow:hover,.chatrow.active{background:#171b28}.chatopen{border:0;background:transparent;color:#dfe3ef;text-align:right;padding:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}.chatmenu{border:0;background:transparent;color:#81889a;cursor:pointer;padding:7px;border-radius:8px}.chatmenu:hover{background:#242a3b;color:white}.sidebottom{border-top:1px solid var(--line);padding:12px}.conn{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}.dot.on{background:var(--good);box-shadow:0 0 10px #34d39988}.main{display:flex;flex-direction:column;min-width:0;height:100vh}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#090b12dd;backdrop-filter:blur(16px);z-index:5}.topTitle{min-width:0}.topTitle strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48vw}.sub{font-size:11px;color:var(--muted);margin-top:3px}.topActions{display:flex;align-items:center;gap:8px}.model{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:230px}.icon{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 10px;cursor:pointer}.mobileMenu{display:none}.messages{flex:1;overflow:auto;scroll-behavior:smooth}.thread{width:min(820px,calc(100% - 34px));margin:0 auto;padding:30px 0 160px}.empty{min-height:60vh;display:grid;place-items:center;text-align:center}.emptyLogo{width:64px;height:64px;margin:auto;border-radius:20px;display:grid;place-items:center;font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 15px 50px #7c3aed44}.empty h1{margin:16px 0 7px;font-size:27px}.empty p{color:var(--muted);margin:0}.message{display:grid;grid-template-columns:38px 1fr;gap:13px;margin:22px 0}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:#252a39}.message.ai .avatar{background:linear-gradient(135deg,var(--purple2),#2563eb)}.bubble{line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin-bottom:5px}.thinking{border:1px solid #443465;background:#151226;border-radius:14px;padding:12px 14px;margin:8px 0 16px}.thinkingHead{display:flex;align-items:center;gap:8px;font-size:13px;color:#d8ccff}.pulse{width:9px;height:9px;border-radius:50%;background:var(--purple);animation:pulse 1.1s infinite}@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}.stage{color:var(--muted);font-size:12px;margin-top:6px}.thought{font-size:13px;color:#bfc5d7;border-top:1px solid #302747;margin-top:9px;padding-top:9px;white-space:pre-wrap;max-height:150px;overflow:auto}.composerWrap{position:absolute;bottom:0;right:280px;left:0;padding:28px 18px 18px;background:linear-gradient(transparent,var(--bg) 32%)}.composer{width:min(820px,100%);margin:auto;border:1px solid #30364a;background:#141927;border-radius:20px;box-shadow:0 18px 55px #0008;padding:10px 11px 9px}.composer textarea{width:100%;border:0;outline:0;background:transparent;color:var(--text);resize:none;min-height:44px;max-height:180px;padding:7px 8px;line-height:1.55}.composeBottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.hint{font-size:11px;color:#737b91;padding:0 7px}.send,.stop{width:38px;height:38px;border:0;border-radius:12px;color:white;cursor:pointer}.send{background:linear-gradient(135deg,var(--purple),#2563eb)}.send:disabled{opacity:.45}.stop{background:#b91c1c;display:none}.stop.show{display:block}.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#22182f;border:1px solid #593c77;padding:10px 14px;border-radius:12px;font-size:13px;display:none;z-index:30}.drawerShade{display:none}
@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;right:0;top:0;bottom:0;width:min(84vw,310px);z-index:30;transform:translateX(105%);transition:.22s}.sidebar.open{transform:none}.drawerShade.show{display:block;position:fixed;inset:0;background:#0008;z-index:29}.mobileMenu{display:block}.top{padding:0 12px}.topTitle strong{max-width:40vw}.model{max-width:145px}.composerWrap{right:0}.thread{width:min(100% - 24px,820px);padding-top:20px}.message{grid-template-columns:32px 1fr;gap:9px}.avatar{width:30px;height:30px}.hint{display:none}}
</style></head><body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">M</div><div><strong>MODY AI</strong><small>Personal AI Workspace</small></div></div><button class="newchat" id="newChat">＋ دردشة جديدة</button><div class="sideLabel">الدردشات</div><div class="chatlist" id="chatList"></div><div class="sidebottom"><div class="conn"><span class="dot" id="dot"></span><span id="connText">جاري الاتصال…</span></div></div></aside><div class="drawerShade" id="shade"></div><main class="main"><header class="top"><div class="topActions"><button class="icon mobileMenu" id="menuBtn">☰</button><select class="model" id="model"><option value="auto">AUTO — الأفضل المتاح</option></select></div><div class="topTitle"><strong id="chatTitle">دردشة جديدة</strong><div class="sub" id="modelStatus">MODY Auto Router</div></div></header><div class="messages" id="messages"><div class="thread" id="thread"></div></div><div class="composerWrap"><div class="composer"><textarea id="prompt" rows="1" placeholder="اسأل MODY أي شيء…"></textarea><div class="composeBottom"><span class="hint">Enter للإرسال • Shift+Enter لسطر جديد</span><div><button class="stop" id="stop" title="إيقاف">■</button><button class="send" id="send" title="إرسال">➤</button></div></div></div></div></main></div><div class="toast" id="toast"></div><script>
const BACKEND='https://modaxai.onrender.com',STORE='modyChatsV2';const $=s=>document.querySelector(s);let chats=[],activeId=null,controller=null,timer=null,started=0;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function load(){try{chats=JSON.parse(localStorage.getItem(STORE)||'[]')}catch{chats=[]}if(!chats.length)createChat(false);activeId=localStorage.getItem('modyActiveChat')||chats[0].id;if(!chats.some(c=>c.id===activeId))activeId=chats[0].id;renderAll()}
function save(){localStorage.setItem(STORE,JSON.stringify(chats.slice(0,60)));localStorage.setItem('modyActiveChat',activeId)}function current(){return chats.find(c=>c.id===activeId)}
function createChat(render=true){const c={id:uid(),title:'دردشة جديدة',created:Date.now(),updated:Date.now(),messages:[]};chats.unshift(c);activeId=c.id;save();if(render)renderAll();closeDrawer()}
function openChat(id){if(controller)controller.abort();activeId=id;save();renderAll();closeDrawer()}
function renameChat(id){const c=chats.find(x=>x.id===id);if(!c)return;const n=prompt('اسم الدردشة',c.title);if(n&&n.trim()){c.title=n.trim().slice(0,80);c.updated=Date.now();save();renderAll()}}
function deleteChat(id){if(!confirm('حذف هذه الدردشة؟'))return;chats=chats.filter(x=>x.id!==id);if(!chats.length){createChat(false)}else if(activeId===id)activeId=chats[0].id;save();renderAll()}
function renderList(){const el=$('#chatList');el.innerHTML='';chats.sort((a,b)=>b.updated-a.updated).forEach(c=>{const row=document.createElement('div');row.className='chatrow'+(c.id===activeId?' active':'');row.innerHTML=`<button class="chatopen">${esc(c.title)}</button><button class="chatmenu">•••</button>`;row.querySelector('.chatopen').onclick=()=>openChat(c.id);row.querySelector('.chatmenu').onclick=e=>{e.stopPropagation();const action=prompt('اكتب: 1 لتغيير الاسم، 2 للحذف','1');if(action==='1')renameChat(c.id);if(action==='2')deleteChat(c.id)};el.appendChild(row)})}
function renderThread(){const c=current();$('#chatTitle').textContent=c?.title||'دردشة جديدة';const t=$('#thread');t.innerHTML='';if(!c||!c.messages.length){t.innerHTML='<div class="empty"><div><div class="emptyLogo">M</div><h1>كيف أساعدك اليوم؟</h1><p>MODY يختار أفضل نموذج متاح تلقائيًا ويعرض حالة العمل مباشرة.</p></div></div>';return}c.messages.forEach(m=>appendMessageDom(m));scrollEnd()}
function appendMessageDom(m){const t=$('#thread');t.querySelector('.empty')?.remove();const d=document.createElement('div');d.className='message '+(m.role==='assistant'?'ai':'user');d.dataset.mid=m.id;d.innerHTML=`<div class="avatar">${m.role==='assistant'?'M':'أ'}</div><div><div class="meta">${m.role==='assistant'?esc(m.model||'MODY'):'أنت'}</div><div class="bubble">${esc(m.content||'')}</div>${m.thought?`<div class="thinking"><div class="thinkingHead">ملخص التفكير</div><div class="thought">${esc(m.thought)}</div></div>`:''}</div>`;t.appendChild(d)}
function renderAll(){renderList();renderThread()}function scrollEnd(){$('#messages').scrollTop=$('#messages').scrollHeight}function toast(x){const e=$('#toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function addThinking(){const t=$('#thread');t.querySelector('.empty')?.remove();const d=document.createElement('div');d.className='message ai';d.id='liveAnswer';d.innerHTML='<div class="avatar">M</div><div><div class="meta" id="liveMeta">MODY</div><div class="thinking" id="thinking"><div class="thinkingHead"><span class="pulse"></span><span id="thinkLabel">MODY يفكر • 00:00</span></div><div class="stage" id="stage">اختيار أفضل نموذج متاح</div><div class="thought" id="thought" style="display:none"></div></div><div class="bubble" id="liveText"></div></div>';t.appendChild(d);started=Date.now();timer=setInterval(()=>{const s=Math.floor((Date.now()-started)/1000);$('#thinkLabel').textContent=`MODY يفكر • ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000);scrollEnd()}
function finishThinking(){clearInterval(timer);timer=null;const box=$('#thinking');if(box){box.querySelector('.pulse')?.remove();const label=$('#thinkLabel');if(label)label.textContent='اكتمل التفكير';box.style.opacity='.82'}}
function parseBlock(block){let type='message',data='';for(const line of block.split(/\r?\n/)){if(line.startsWith('event:'))type=line.slice(6).trim();if(line.startsWith('data:'))data+=line.slice(5).trim()}if(!data)return null;try{return{type,data:JSON.parse(data)}}catch{return null}}
async function streamChat(payload,onEvent,signal){const r=await fetch(BACKEND+'/v1/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal});if(!r.ok){const x=await r.json().catch(()=>({}));throw new Error(x.error||`HTTP ${r.status}`)}if(!r.body)throw new Error('Streaming غير مدعوم في هذا المتصفح');const reader=r.body.getReader(),dec=new TextDecoder();let buf='';while(true){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const parts=buf.split(/\r?\n\r?\n/);buf=parts.pop()||'';for(const p of parts){const ev=parseBlock(p);if(ev)onEvent(ev)}}}
async function send(){const text=$('#prompt').value.trim();if(!text||controller)return;const c=current();$('#prompt').value='';resize();const user={id:uid(),role:'user',content:text,time:Date.now()};c.messages.push(user);if(c.title==='دردشة جديدة')c.title=text.replace(/\s+/g,' ').slice(0,42);c.updated=Date.now();save();renderList();appendMessageDom(user);addThinking();$('#send').disabled=true;$('#stop').classList.add('show');controller=new AbortController();let answer='',thought='',usedModel='AUTO';const history=c.messages.slice(-30).map(m=>({role:m.role,content:m.content}));try{await streamChat({provider:'google',model:$('#model').value||'auto',prompt:text,messages:history},ev=>{if(ev.type==='status'){if(ev.data.message)$('#stage').textContent=ev.data.message;if(ev.data.model)$('#liveMeta').textContent='MODY · '+ev.data.model}if(ev.type==='model'){usedModel=ev.data.model||usedModel;$('#liveMeta').textContent='MODY · '+usedModel;$('#modelStatus').textContent=usedModel+' يعمل الآن'}if(ev.type==='thought'){thought+=ev.data.text||'';const x=$('#thought');x.style.display='block';x.textContent=thought;scrollEnd()}if(ev.type==='text'){answer+=ev.data.text||'';$('#liveText').textContent=answer;scrollEnd()}if(ev.type==='error')throw new Error(ev.data.message||'Streaming error')},controller.signal);if(answer||thought){c.messages.push({id:uid(),role:'assistant',content:answer||'اكتملت المعالجة دون رد نصي.',thought,model:usedModel,time:Date.now()});c.updated=Date.now();save()}}catch(e){if(e.name==='AbortError'){if(answer)c.messages.push({id:uid(),role:'assistant',content:answer+'\n\n[تم الإيقاف]',thought,model:usedModel,time:Date.now()});toast('تم إيقاف الرد')}else{const msg='تعذر إكمال الرد: '+e.message;c.messages.push({id:uid(),role:'assistant',content:msg,thought,model:usedModel,time:Date.now()});toast(msg)}save()}finally{finishThinking();controller=null;$('#send').disabled=false;$('#stop').classList.remove('show');renderAll()}}
async function boot(){try{const r=await fetch(BACKEND+'/health',{cache:'no-store'}),h=await r.json();if(!r.ok)throw 0;$('#dot').classList.add('on');$('#connText').textContent=`متصل · v${h.version||'online'}`;$('#modelStatus').textContent=h.streaming?'Streaming جاهز':'Backend متصل';const m=await fetch(BACKEND+'/v1/models?provider=google',{cache:'no-store'}).then(x=>x.json());const ids=m.auto_priority||[];for(const id of ids){const o=document.createElement('option');o.value=id;o.textContent=id;$('#model').appendChild(o)}}catch{$('#connText').textContent='Backend غير متاح الآن';$('#modelStatus').textContent='محاولة الاتصال بالخادم'}}
function resize(){const p=$('#prompt');p.style.height='auto';p.style.height=Math.min(p.scrollHeight,180)+'px'}function closeDrawer(){$('#sidebar').classList.remove('open');$('#shade').classList.remove('show')}$('#newChat').onclick=()=>createChat();$('#send').onclick=send;$('#stop').onclick=()=>controller?.abort();$('#prompt').oninput=resize;$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#shade').classList.add('show')};$('#shade').onclick=closeDrawer;load();boot();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
