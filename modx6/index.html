<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0d0b14">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MODX 6 Egypt">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="MODX 6 Egypt — Game, Video, Education and Browser AI studios in one app-like PWA.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>MODX 6 Egypt</title>
  <style>
    :root{
      --bg:#0d0b14;--panel:#17131f;--panel2:#211a2c;--line:#352b46;
      --text:#f7f3ff;--muted:#aaa2ba;--primary:#7c4dff;--primary2:#9b79ff;
      --good:#43d17d;--warn:#ffb84d;--radius:22px;--safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
    body{position:fixed;inset:0}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .app{height:100dvh;display:flex;flex-direction:column;background:
      radial-gradient(900px 520px at 85% -10%,rgba(124,77,255,.18),transparent 60%),var(--bg)}
    .topbar{padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(13,11,20,.88);backdrop-filter:blur(18px);z-index:5}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--primary),#4b1fb8);font-weight:900;box-shadow:0 10px 30px rgba(124,77,255,.28)}
    .brand b{font-size:16px;white-space:nowrap}
    .status{font-size:11px;color:var(--muted);white-space:nowrap}
    .actions{display:flex;gap:8px}
    .iconbtn,.pillbtn{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);border-radius:13px;min-height:38px;padding:0 12px}
    .iconbtn{width:40px;padding:0;font-size:18px}
    .main{flex:1;overflow:auto;padding:18px 16px calc(22px + var(--safe-bottom));scrollbar-width:none}
    .main::-webkit-scrollbar{display:none}
    .hero{max-width:1180px;margin:0 auto 18px}
    .hero h1{font-size:clamp(26px,5vw,44px);margin:4px 0 8px;letter-spacing:-.7px}
    .hero p{margin:0;color:var(--muted);line-height:1.7;max-width:750px}
    .routebar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .chip{padding:8px 11px;border-radius:999px;background:rgba(124,77,255,.1);border:1px solid rgba(124,77,255,.28);color:#d9ccff;font-size:12px}
    .grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .card{appearance:none;text-align:right;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));color:var(--text);border-radius:var(--radius);padding:17px;min-height:188px;display:flex;flex-direction:column;transition:.18s transform,.18s border-color,.18s background}
    .card:hover{transform:translateY(-2px);border-color:#57446f;background:rgba(255,255,255,.05)}
    .card:active{transform:scale(.99)}
    .cardicon{width:48px;height:48px;border-radius:16px;background:rgba(124,77,255,.14);display:grid;place-items:center;font-size:23px;margin-bottom:18px}
    .card h2{margin:0 0 7px;font-size:19px}.card p{margin:0;color:var(--muted);line-height:1.55;font-size:13px}
    .card .open{margin-top:auto;padding-top:16px;color:#cbbcff;font-size:12px}
    .screen{max-width:920px;margin:0 auto}
    .screenhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .back{border:1px solid var(--line);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:14px;font-size:20px}
    .screenhead h1{margin:0;font-size:24px}.screenhead p{margin:3px 0 0;color:var(--muted);font-size:13px}
    .section{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .section h3{margin:0 0 12px;font-size:16px}
    .stack{display:grid;gap:10px}
    .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:12px 14px;text-align:right}
    .btn.primary{background:linear-gradient(135deg,var(--primary),#5b2ad6);border-color:transparent;font-weight:700;text-align:center}
    .btn:active{transform:scale(.995)}
    .field,textarea,select{width:100%;border:1px solid var(--line);background:#110e18;color:var(--text);border-radius:14px;padding:12px 13px;outline:none}
    textarea{min-height:118px;resize:vertical}
    .field:focus,textarea:focus,select:focus{border-color:var(--primary)}
    .label{font-size:12px;color:var(--muted);margin:2px 2px 6px}
    .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .tile{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:14px}
    .tile b{display:block;margin-bottom:4px}.tile span{color:var(--muted);font-size:12px;line-height:1.5}
    .note{color:var(--muted);font-size:12px;line-height:1.65;margin-top:10px}
    .chatShell{display:flex;flex-direction:column;height:calc(100dvh - 150px);min-height:520px;border:1px solid var(--line);background:rgba(16,13,23,.72);border-radius:var(--radius);overflow:hidden}
    .chatTop{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.02)}
    .chatTop b{font-size:14px}.chatState{font-size:11px;color:var(--muted)}
    .chatMessages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
    .chatMessages::-webkit-scrollbar{display:none}
    .msg{max-width:min(82%,720px);padding:11px 13px;border-radius:17px;line-height:1.65;white-space:pre-wrap;word-break:break-word;font-size:14px}
    .msg.user{align-self:flex-start;background:linear-gradient(135deg,var(--primary),#5b2ad6);border-bottom-left-radius:6px}
    .msg.ai{align-self:flex-end;background:var(--panel2);border:1px solid var(--line);border-bottom-right-radius:6px}
    .msg.pending{opacity:.72}
    .fileTray{display:flex;flex-wrap:wrap;gap:6px;padding:7px 11px;border-top:1px solid var(--line)}
    .fileChip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel2);padding:6px 10px;border-radius:13px;max-width:100%;font-size:12px;overflow-wrap:anywhere}
    .fileChip button{color:#fff;border:0;background:transparent;font-size:16px;cursor:pointer}
    .chatComposer{padding:10px;border-top:1px solid var(--line);background:rgba(13,11,20,.95);display:flex;gap:8px;align-items:flex-end}
    .chatInput{flex:1;min-height:46px;max-height:120px;resize:none;border:1px solid var(--line);background:#110e18;color:var(--text);border-radius:16px;padding:12px 13px;outline:none}
    .chatInput:focus{border-color:var(--primary)}
    .micBtn,.sendBtn{width:46px;height:46px;flex:0 0 46px;border:none;border-radius:15px;color:#fff;font-size:18px}
    .micBtn{background:#2a2237;border:1px solid var(--line)}.micBtn.listening{background:#8a2d4c;box-shadow:0 0 0 5px rgba(255,74,125,.12)}
    .sendBtn{background:linear-gradient(135deg,var(--primary),#5b2ad6)}
    .toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-bottom));transform:translateX(-50%) translateY(25px);background:#251d33;border:1px solid #49395e;color:#fff;border-radius:14px;padding:11px 14px;opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:min(92vw,560px);text-align:center;font-size:13px}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .splash{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 35%,#2a1451 0%,#0a0712 58%,#050309 100%);display:grid;place-items:center;transition:.3s opacity}
    .splash.hide{opacity:0;pointer-events:none}
    .splashbox{text-align:center}.splashmark{margin:auto;width:80px;height:80px;border-radius:24px;display:grid;place-items:center;font-size:28px;font-weight:900;background:linear-gradient(145deg,var(--primary),#4b1fb8);box-shadow:0 20px 70px rgba(124,77,255,.35)}
    .splash h2{margin:16px 0 5px}.splash p{margin:0;color:var(--muted);font-size:12px}
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:620px){
      .topbar{padding-left:12px;padding-right:12px}.status{display:none}.main{padding-left:12px;padding-right:12px}
      .grid{grid-template-columns:1fr}.card{min-height:145px}.tiles{grid-template-columns:1fr}
      .hero h1{font-size:30px}.brand b{font-size:14px}.pillbtn{padding:0 10px;font-size:12px}
    }
    @media(display-mode:standalone){.install-only{display:none!important}}
  </style>
</head>
<body>
<div class="splash" id="splash"><div class="splashbox"><div class="splashmark">M6</div><h2>MODX 6 Egypt</h2><p>Chat • Game • Video • Education • Browser</p></div></div>
<div class="app">
  <header class="topbar">
    <div class="brand"><img class="mark" src="./face.svg" alt="وجه MODX"><div><b>MODX 6 Egypt</b><div class="status">AUTO • Local / Paired / Cloud</div></div></div>
    <div class="actions">
      <button class="pillbtn install-only" id="installBtn">تثبيت</button>
      <button class="iconbtn" id="fullBtn" title="ملء الشاشة">⛶</button>
    </div>
  </header>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const main=document.getElementById('main'),toast=document.getElementById('toast');
let deferredPrompt=null;
const studios={
  chat:{title:'بربمدز + MODAX',icon:'🧠',subtitle:'شات ذكاء اصطناعي بوجه ومايك ووضع مراجعة إضافية، وMODAX الأصلي في نفس التطبيق.'},
  game:{title:'Game Studio',icon:'🎮',subtitle:'Build and repair games from any device.'},
  video:{title:'Video Studio',icon:'🎬',subtitle:'Create video with AUTO model routing.'},
  education:{title:'Education Studio',icon:'🎓',subtitle:'Learn with an adaptive tutor.'},
  browser:{title:'Browser Agent',icon:'🌐',subtitle:'Controlled browser workspace.'}
};
// The independent MODX server is not yet deployed. Never forward files to Modax.
const CHAT_BACKEND_KEY='modx6_gateway_url';
let chatBackend=localStorage.getItem(CHAT_BACKEND_KEY)||'';
const chatFiles=[];
let chatSending=false;
function gatewayUrl(){
  if(!chatBackend)throw new Error('MODX Gateway غير موصول بعد. أضف رابط خادم MODX أولاً.');
  const u=new URL(chatBackend);
  if(u.username||u.password||u.search||u.hash||u.protocol!=='https:')throw new Error('رابط الخادم لازم يبدأ بـ HTTPS.');
  return u.href.replace(/\/$/,'');
}
function configureGateway(){
 const next=prompt('عنوان MODX Gateway المستقل (HTTPS):',chatBackend);
 if(next===null)return;
 if(!next.trim()){chatBackend='';localStorage.removeItem(CHAT_BACKEND_KEY);notify('تم إلغاء ربط الخادم');return}
 try{const u=new URL(next.trim());if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw new Error();chatBackend=u.href.replace(/\/$/,'');localStorage.setItem(CHAT_BACKEND_KEY,chatBackend);notify('تم حفظ عنوان خادم MODX')}catch{notify('اكتب رابط HTTPS صحيحًا، من دون بيانات دخول أو معاملات')}
}
function uploadMime(name){
 const ext=name.split('.').pop().toLowerCase();
 return ({pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',md:'text/markdown',csv:'text/csv',json:'application/json',xml:'text/xml',html:'text/html',css:'text/css',js:'text/javascript',ts:'text/javascript',txt:'text/plain',py:'text/plain',dart:'text/plain',gd:'text/plain'})[ext]||'';
}
function toBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');reader.onerror=reject;reader.readAsDataURL(file)})}
function renderChatFiles(){
 const tray=document.getElementById('fileTray');if(!tray)return;
 tray.style.display=chatFiles.length?'flex':'none';
 tray.innerHTML=chatFiles.map((f,i)=>'<span class="fileChip">📎 '+esc(f.name)+' ('+Math.ceil(f.bytes/1024)+' KB) <button title="إزالة الملف" onclick="removeChatFile('+i+')">×</button></span>').join('');
}
function removeChatFile(index){if(chatSending)return;chatFiles.splice(index,1);renderChatFiles()}
async function selectChatFiles(input){
 try{
  const incoming=[...input.files];let total=chatFiles.reduce((sum,f)=>sum+f.bytes,0);const candidates=[];
  for(const file of incoming){
   const mimeType=uploadMime(file.name);
   if(!mimeType)throw new Error('نوع ملف غير مدعوم: '+file.name);
   if(!file.size||file.size>4*1024*1024)throw new Error('حجم كل ملف يجب ألا يتجاوز 4 MB');
   if(!['application/pdf','image/png','image/jpeg','image/webp'].includes(mimeType)&&file.size>512*1024)throw new Error('الملف النصي يجب ألا يتجاوز 512 KB');
   if(chatFiles.length+candidates.length>=4)throw new Error('الحد الأقصى 4 ملفات');
   total+=file.size;if(total>6*1024*1024)throw new Error('إجمالي الملفات يجب ألا يتجاوز 6 MB');
   candidates.push({name:file.name,mimeType,bytes:file.size,dataBase64:await toBase64(file)});
  }
  chatFiles.push(...candidates);renderChatFiles();
 }catch(e){notify(e.message)}finally{input.value=''}
}
const CHAT_STORE='modx6ChatV1';
let chatHistory=[];
let recognition=null;
try{chatHistory=JSON.parse(localStorage.getItem(CHAT_STORE)||'[]')}catch{chatHistory=[]}
function saveChat(){localStorage.setItem(CHAT_STORE,JSON.stringify(chatHistory.slice(-40)))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),2600)}
function nav(to){if(to==='chat'){location.href='./assistant.html';return;}location.hash=to==='home'?'#home':'#'+to}
function home(){
 main.innerHTML=`<section class="hero"><h1>كل أدوات MODX في واجهة واحدة</h1><p>نفس تجربة التطبيق على الموبايل والكمبيوتر. تظهر لك نفس الاستوديوهات، ويقرر AUTO أين تُنفذ المهمة حسب الجهاز والقدرات المتاحة.</p><div class="routebar"><button class="chip" style="cursor:pointer" onclick="nav('chat')">✦ اتكلم مع بربمدز أو MODAX 🎤</button><span class="chip">AUTO routing</span><span class="chip">Local</span><span class="chip">Paired Device</span><span class="chip">Cloud Worker</span></div></section>
 <section class="grid">
 ${Object.entries(studios).map(([k,s])=>`<button class="card" onclick="nav('${k}')"><div class="cardicon">${s.icon}</div><h2>${s.title}</h2><p>${s.subtitle}</p><div class="open">فتح الاستوديو ←</div></button>`).join('')}
 </section>`;
}
function shell(key,body){const s=studios[key];main.innerHTML=`<section class="screen"><div class="screenhead"><button class="back" onclick="nav('home')">→</button><div><h1>${s.icon} ${s.title}</h1><p>${s.subtitle}</p></div></div>${body}</section>`}
function renderChatMessages(){
 const box=document.getElementById('chatMessages');if(!box)return;
 if(!chatHistory.length){
   box.innerHTML='<div class="msg ai">أهلاً، أنا MODX Chat. اسألني أو استخدم زر المايك 🎤</div>';
 }else{
   box.innerHTML=chatHistory.map(m=>'<div class="msg '+(m.role==='user'?'user':'ai')+'">'+esc(m.content)+'</div>').join('');
 }
 box.scrollTop=box.scrollHeight;
}
function parseSseBlock(block){
 let type='message',data='';for(const line of block.split(/\r?\n/)){if(line.startsWith('event:'))type=line.slice(6).trim();if(line.startsWith('data:'))data+=line.slice(5).trim()}
 if(!data)return null;try{return{type,data:JSON.parse(data)}}catch{return null}
}
async function sendChat(){
 const input=document.getElementById('chatInput');if(!input||chatSending)return;
 const raw=input.value.trim();if(!raw&&!chatFiles.length)return;
 let endpoint;
 try{endpoint=gatewayUrl()+'/v1/modx/chat'}catch(e){notify(e.message);return}
 const text=raw||'حلّل الملفات المرفقة.';
 const files=chatFiles.slice();
 const display=text+(files.length?'\n'+files.map(f=>'📎 '+f.name).join(' · '):'');
 chatHistory.push({role:'user',content:display});renderChatMessages();
 chatSending=true;
 const state=document.getElementById('chatState');if(state)state.textContent='Processing…';
 const box=document.getElementById('chatMessages');
 const pending=document.createElement('div');pending.className='msg ai pending';pending.textContent='Gemini يراجع الرسالة…';box.appendChild(pending);box.scrollTop=box.scrollHeight;
 try{
  const result=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   messages:chatHistory.slice(-24).map(m=>({role:m.role,content:m.content})),
   attachments:files.map(({name,mimeType,dataBase64})=>({name,mimeType,dataBase64}))
  })});
  const data=await result.json().catch(()=>({}));
  if(!result.ok)throw new Error(data.error||'HTTP '+result.status);
  const answer=String(data.response||data.text||'').trim();
  if(!answer)throw new Error('لم يصل رد من Gemini');
  chatHistory.push({role:'assistant',content:answer});saveChat();
  chatFiles.splice(0,files.length);renderChatFiles();
  input.value='';renderChatMessages();
 }catch(err){
  chatHistory.pop();renderChatMessages();notify('تعذر رفع الملفات أو إرسال الرسالة: '+err.message);
 }finally{chatSending=false;if(state)state.textContent=chatBackend?'Ready • MODX Gateway':'Gateway offline'}
}
function startMic(){
 const input=document.getElementById('chatInput'),mic=document.getElementById('micBtn'),state=document.getElementById('chatState');if(!input||!mic)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){notify('المتصفح لا يدعم التعرف الصوتي هنا. استخدم Chrome/Edge أو أضف التطبيق للشاشة الرئيسية.');return}
 if(recognition){try{recognition.stop()}catch{} recognition=null;mic.classList.remove('listening');if(state)state.textContent='Ready • Gemini AUTO';return}
 recognition=new SR();recognition.lang='ar-EG';recognition.interimResults=true;recognition.continuous=false;
 let finalText='';
 recognition.onstart=()=>{mic.classList.add('listening');if(state)state.textContent='Listening…'};
 recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t;else interim+=t}input.value=(finalText||interim).trim()};
 recognition.onerror=e=>{notify('مشكلة في المايك: '+(e.error||'غير معروف'))};
 recognition.onend=()=>{mic.classList.remove('listening');recognition=null;if(state)state.textContent='Ready • Gemini AUTO';input.focus()};
 recognition.start();
}
function chat(){
 shell('chat',`<div class="chatShell">
 <div class="chatTop"><b>Gemini • MODX</b><button class="iconbtn" onclick="configureGateway()" title="إعداد خادم MODX">⚙</button><span class="chatState" id="chatState">Gateway: غير موصول</span></div>
 <div class="chatMessages" id="chatMessages"></div>
 <div id="fileTray" class="fileTray" style="display:none"></div>
 <div class="chatComposer">
   <textarea class="chatInput" id="chatInput" rows="1" placeholder="اكتب رسالة أو اضغط المايك…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
   <input type="file" id="chatFileInput" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.csv,.json,.xml,.html,.css,.js,.ts,.py,.dart,.gd" onchange="selectChatFiles(this)">
   <button class="micBtn" onclick="document.getElementById('chatFileInput').click()" title="إرفاق ملفات">📎</button>
   <button class="micBtn" id="micBtn" onclick="startMic()" title="مايك">🎤</button>
   <button class="sendBtn" onclick="sendChat()" title="إرسال">➤</button>
 </div>
 </div>`);
 renderChatMessages();renderChatFiles();
 const st=document.getElementById('chatState');if(st)st.textContent=chatBackend?'Ready • MODX Gateway':'Gateway: اضبط الرابط ⚙';
}
function game(){
 shell('game',`<div class="section"><h3>المحركات</h3><div class="routebar"><span class="chip">Godot • V1</span><span class="chip">Unity • next</span><span class="chip">Unreal • next</span></div></div>
 <div class="section"><h3>Project actions</h3><div class="stack">
 <button class="btn primary" onclick="notify('Detect Engine جاهز للربط بمنفذ التنفيذ')">Detect Engine</button>
 <button class="btn" onclick="notify('اختيار المشروع يتطلب ربط جهاز أو Cloud Worker')">Select / Connect Project</button>
 <button class="btn" onclick="notify('Inspect Project جاهز بعد ربط المشروع')">Inspect Project</button>
 <button class="btn" onclick="notify('Validate Project جاهز بعد ربط المشروع')">Validate Project</button>
 <button class="btn" onclick="notify('Headless Test يوجّه تلقائيًا لجهاز مناسب')">Run Headless Test</button>
 </div><div class="note">AUTO يبقي نفس الأوامر ظاهرة على iPhone والمتصفح، ويرسل العمل الثقيل إلى جهاز مقترن أو Cloud Worker عند عدم توفر التنفيذ المحلي.</div></div>`);
}
function video(){
