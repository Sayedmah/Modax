use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - bing
      - wikipedia
general:
  instance_name: MODAX Search
  debug: false
  enable_metrics: false
search:
  formats:
    - json
  safe_search: 1
  autocomplete: ""
  favicon_resolver: ""
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 8
  pool_maxsize: 8
