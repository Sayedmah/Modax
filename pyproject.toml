[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modax-omega"
version = "0.6.3"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "starlette==0.52.1", "anyio==4.12.1", "cryptography>=46,<51", "psycopg[binary]>=3.2,<4", "pypdf>=6,<7", "openpyxl==3.1.5", "python-docx==1.2.0", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
