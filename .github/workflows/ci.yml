name: MODAX verified foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-and-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Install fixed Godot version
        run: |
          curl -fL --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
      - run: python -m ruff check backend tests
      - run: python -m pytest -q
        env:
          MODAX_TEST_GODOT: /tmp/godot/Godot_v4.6-stable_linux.x86_64
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check apps/web/app.js
      - run: node --test scripts/ui_state.test.cjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:ui
        env:
          MODAX_QA_GUEST: "true"
      - name: Preserve generated playable project
        run: python scripts/generate_game.py /tmp/crystal-island --godot /tmp/godot/Godot_v4.6-stable_linux.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: modax-crystal-island-source
          path: /tmp/crystal-island

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: modax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_postgres.py
        env:
          MODAX_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/modax_test
