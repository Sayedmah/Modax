name: Build MODAX ESP32-WROOM-32 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - esp32-flasher-site
    paths:
      - 'firmware/esp32-wroom32/**'
      - '.github/workflows/build-modax-wroom32.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esp32-flasher-site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade platformio esptool

      - name: Build firmware
        run: pio run -d firmware/esp32-wroom32

      - name: Publish full and OTA images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/firmware

          python -m esptool --chip esp32 merge_bin             -o site/firmware/modax-esp32-wroom32-full.bin             --flash_mode dio --flash_freq 40m --flash_size 4MB             0x1000 firmware/esp32-wroom32/.pio/build/esp32dev/bootloader.bin             0x8000 firmware/esp32-wroom32/.pio/build/esp32dev/partitions.bin             0x10000 firmware/esp32-wroom32/.pio/build/esp32dev/firmware.bin

          cp firmware/esp32-wroom32/.pio/build/esp32dev/firmware.bin             site/firmware/modax-esp32-wroom32-ota.bin

          sha256sum site/firmware/modax-esp32-wroom32-full.bin             > site/firmware/modax-esp32-wroom32-full.bin.sha256
          sha256sum site/firmware/modax-esp32-wroom32-ota.bin             > site/firmware/modax-esp32-wroom32-ota.bin.sha256

          printf '{"build":"%s","commit":"%s","ota":true}\n'             "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > site/firmware/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: modax-esp32-wroom32
          path: |
            site/firmware/modax-esp32-wroom32-full.bin
            site/firmware/modax-esp32-wroom32-full.bin.sha256
            site/firmware/modax-esp32-wroom32-ota.bin
            site/firmware/modax-esp32-wroom32-ota.bin.sha256
            site/firmware/version.json

      - name: Publish firmware into site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/modax-publish
          cp site/firmware/modax-esp32-wroom32-full.bin /tmp/modax-publish/
          cp site/firmware/modax-esp32-wroom32-full.bin.sha256 /tmp/modax-publish/
          cp site/firmware/modax-esp32-wroom32-ota.bin /tmp/modax-publish/
          cp site/firmware/modax-esp32-wroom32-ota.bin.sha256 /tmp/modax-publish/
          cp site/firmware/version.json /tmp/modax-publish/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin esp32-flasher-site
          git reset --hard origin/esp32-flasher-site

          mkdir -p site/firmware
          cp /tmp/modax-publish/* site/firmware/
          git add site/firmware

          if git diff --cached --quiet; then
            echo "No firmware changes"
          else
            git commit -m "Publish latest MODAX ESP32 firmware"
            git push origin HEAD:esp32-flasher-site
          fi
